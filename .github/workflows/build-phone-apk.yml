name: Build 143 M31 Phone Test APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$ANDROID_SDK_ROOT/emulator" "$ANDROID_SDK_ROOT/system-images"
          if [[ -d "$ANDROID_SDK_ROOT/ndk" ]]; then
            find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 ! -name '28.2.13676358' -exec sudo rm -rf {} +
          fi
          docker system prune --all --force || true
          df -h /

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          flutter doctor -v

      - name: Restore Gradle wrapper only if missing
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f android/gradlew ]]; then
            TMP="$RUNNER_TEMP/one_four_three_wrapper"
            flutter create --platforms=android --org com.x10think --project-name one_four_three "$TMP"
            cp "$TMP/android/gradlew" android/gradlew
            cp "$TMP/android/gradlew.bat" android/gradlew.bat
            mkdir -p android/gradle/wrapper
            cp "$TMP/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x android/gradlew

      - name: Fetch Flutter packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build installable debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://143-backend-staging.vercel.app/api/index.php/api/v1

      - name: Finalize artifact and checksum
        shell: bash
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-debug.apk 143_M31_PHONE_TEST_DEBUG.apk
          sha256sum 143_M31_PHONE_TEST_DEBUG.apk > 143_M31_PHONE_TEST_DEBUG.apk.sha256
          ls -lh 143_M31_PHONE_TEST_DEBUG.apk 143_M31_PHONE_TEST_DEBUG.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 143_M31_PHONE_TEST_DEBUG
          path: |
            143_M31_PHONE_TEST_DEBUG.apk
            143_M31_PHONE_TEST_DEBUG.apk.sha256
          if-no-files-found: error
          retention-days: 30

